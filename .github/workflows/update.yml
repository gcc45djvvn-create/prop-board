name: update-board
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scripts/run_all.py
      - run: |
          git config user.name "board-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/board.json data/cache
          git diff --cached --quiet || (git commit -m "update board" && git push)
